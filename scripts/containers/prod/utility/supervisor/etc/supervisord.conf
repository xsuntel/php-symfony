; ----------------------------------------------------------------------------------------------------------------------
; Supervisor                                                              http://supervisord.org/configuration.html
; ----------------------------------------------------------------------------------------------------------------------
; Exec'd as PID 1 by scripts/containers/prod/utility/entrypoint.sh.
; Copied to /etc/supervisord.conf by scripts/containers/prod/Dockerfile (STEP 05).

[supervisord]
; Required: without it supervisord daemonizes and the container exits immediately.
nodaemon=true
; supervisord itself must stay root so each [program] below can drop to an unprivileged user.
user=root
; Program output already goes to the container's stdout/stderr; supervisord's own log is noise.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

; Needed by `supervisorctl status`, which scripts/containers/prod/deploy.sh calls to verify startup.
[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ----------------------------------------------------------------------------------------------------------------------
; Programs
; ----------------------------------------------------------------------------------------------------------------------
; The masters run as root so they can drop their own workers: php-fpm to the `www-data` pool user set in
; app/php/etc/php-fpm.d/www.conf, nginx to the Alpine default set in server/nginx/etc/nginx/nginx.conf.

; php-fpm must be accepting connections before nginx starts proxying to it — hence the lower priority.
[program:php-fpm]
command=php-fpm -F
priority=10
autostart=true
autorestart=true
startretries=3
; QUIT is php-fpm's graceful shutdown: finish in-flight requests, then exit.
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startretries=3
; QUIT is nginx's graceful shutdown; TERM would drop in-flight requests.
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ----------------------------------------------------------------------------------------------------------------------
; Include
; ----------------------------------------------------------------------------------------------------------------------
; Without this section supervisor.d/messenger-consume.ini is never read and no Messenger worker runs.
[include]
files = /etc/supervisor.d/*.ini
