; ----------------------------------------------------------------------------------------------------------------------
; Supervisor                                                              https://symfony.com/doc/current/messenger.html
; ----------------------------------------------------------------------------------------------------------------------
; Picked up via `[include] files = /etc/supervisor.d/*.ini` in /etc/supervisord.conf.

[program:messenger-consume]
command=php /var/www/app/bin/console messenger:consume --all --time-limit=3600 --memory-limit=256M
; Same unprivileged user as the php-fpm pool; the workers share var/{cache,log} with it.
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
priority=30
startsecs=0
startretries=5
autostart=true
autorestart=true
; SIGTERM is what messenger:consume traps to finish the in-flight message before exiting. stopwaitsecs
; must exceed the slowest handler, or supervisor SIGKILLs mid-message and the ack is lost.
stopsignal=TERM
stopwaitsecs=60
; Stop the whole process group, otherwise a handler's child process can outlive the worker.
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
