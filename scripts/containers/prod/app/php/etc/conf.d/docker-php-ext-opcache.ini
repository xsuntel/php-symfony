; ----------------------------------------------------------------------------------------------------------------------
; PHP - OPcache                                                                https://www.php.net/manual/en/opcache.configuration.php
; ----------------------------------------------------------------------------------------------------------------------
; Copied to $PHP_INI_DIR/conf.d/ by scripts/containers/prod/Dockerfile (STEP 05).
; Production-only settings — the dev environment runs PHP on the host, not from this image.

; Enable Opcache extension module
zend_extension = opcache

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16

; OPcache rounds this up to the next value in its stepped prime set; 65407 covers a Symfony app plus
; its vendor tree several times over. The previous 500000 preallocated a hash table for a file count
; no PHP application reaches, spending memory that memory_consumption above then could not use.
opcache.max_accelerated_files = 65407

; The two below are a pair: with timestamp validation off, the file-override cache is safe because
; nothing on disk can change under a running container. Never enable one without the other.
opcache.validate_timestamps = 0
opcache.enable_file_override = 1

opcache.huge_code_pages = 1

; opcache.preload lives in its own file, docker-php-ext-opcache-preload.ini, because the entrypoint
; deletes it when the preload script is absent. See the comment in that file.
