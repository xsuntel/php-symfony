; ----------------------------------------------------------------------------------------------------------------------
; PHP - OPcache - Preloading                                          https://www.php.net/manual/en/opcache.preloading.php
; ----------------------------------------------------------------------------------------------------------------------
; Split out from docker-php-ext-opcache.ini so it can be removed as a unit.
;
; A missing preload script is NOT a soft failure: PHP raises a startup fatal and PHP-FPM refuses to
; start at all. Because the nginx health check is short-circuited (`return 200;`), the container would
; then report healthy while serving no PHP whatsoever. To avoid that, entrypoint.sh deletes this file
; when /var/www/app/config/preload.php is absent, trading the optimization for a working pool.
;
; Symfony's framework-bundle recipe ships config/preload.php, so a normally scaffolded app keeps it.
; preload_user must match the pool user in app/php/etc/php-fpm.d/www.conf.

opcache.preload = /var/www/app/config/preload.php
opcache.preload_user = www-data
