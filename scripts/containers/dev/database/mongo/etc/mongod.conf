# ----------------------------------------------------------------------------------------------------------------------
# Mongo - mongod.conf                                    https://www.mongodb.com/docs/manual/reference/configuration-options/
# ----------------------------------------------------------------------------------------------------------------------
# Loaded explicitly by the CMD in scripts/containers/dev/database/mongo/Dockerfile — the official image
# ships no /etc/mongod.conf and its default CMD is a bare `mongod`.

# Where and how to store data.
storage:
    # Must match the `mongo_volume` mount target in docker-compose.yml. The official image uses /data/db,
    # not the distro-package /var/lib/mongo.
    dbPath: /data/db

# Where to write logging data.
systemLog:
    # `file` would hide startup errors from `docker logs`; the container's stdout is the log sink.
    destination: file
    path: /dev/stdout
    logAppend: true

# network interfaces
net:
    port: 27017
    # 0.0.0.0 is required for the container to be reachable across the compose network. The published
    # port in docker-compose.yml is bound to 127.0.0.1, so this is not exposed off-host.
    bindIp: 0.0.0.0
    maxIncomingConnections: 20000

# how the process runs
processManagement:
    timeZoneInfo: /usr/share/zoneinfo

# Root credentials come from MONGO_INITDB_ROOT_* in database/mongo/.env; enable once a dev app user exists.
#security:
    #authorization: enabled

#operationProfiling:

#replication:
    #oplogSizeMB: 10240
    #replSetName: "AppReplSet"

#sharding:

# >>>> Enterprise-Only Options:

#auditLog:

#snmp:
