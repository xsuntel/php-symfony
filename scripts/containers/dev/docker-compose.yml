# ----------------------------------------------------------------------------------------------------------------------
# Docker - Docker-Compose                                                   https://docs.docker.com/compose/compose-file
# ----------------------------------------------------------------------------------------------------------------------
# >>>> Dev Environment                                         https://docs.docker.com/compose/compose-file/05-services/
#
# Every path below is relative to the REPOSITORY ROOT, not to this file. Compose resolves them against
# the project directory, which defaults to this file's own directory — so the project directory must be
# passed explicitly. The canonical entry point is scripts/base/utility/docker/_deploy.sh; see also
# `## Usage` in scripts/containers/dev/CLAUDE.md.

# ----------------------------------------------------------------------------------------------------------------------
# Project                                                          https://docs.docker.com/compose/project-name/
# ----------------------------------------------------------------------------------------------------------------------
# Pinned so the generated network is deterministically `symfony_back-end`. Without it the name is derived
# from the --project-directory basename (`symfony-scripts`), and scripts/containers/prod/deploy.sh, which
# attaches the app container with `--net symfony_back-end`, fails to find the network.
name: symfony

# ----------------------------------------------------------------------------------------------------------------------
# Architecture
# ----------------------------------------------------------------------------------------------------------------------
services:
  # >>>> Cache - Redis                                                                    https://hub.docker.com/_/redis
  redis:
    profiles: ["core"]
    container_name: ${DOCKER_CONTAINER_NAME}-redis-${DOCKER_ENVIRONMENT}
    build:
      context: .
      dockerfile: scripts/containers/dev/cache/redis/Dockerfile
      args:
        - VERSION=${REDIS_VERSION:-7.0}
    env_file:
      - scripts/containers/dev/cache/redis/.env
    networks:
      - back-end
    ports:
      - 127.0.0.1:${REDIS_LOCALHOST_PORT}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_volume:/data
    # No `command:` override — it would replace the Dockerfile CMD wholesale and leave
    # cache/redis/etc/redis.conf unread. That file is the single source of truth for tuning.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 1024M
    restart: unless-stopped

  # >>>> Database - PostgreSQL                                                         https://hub.docker.com/_/postgres
  postgres:
    profiles: ["core"]
    container_name: ${DOCKER_CONTAINER_NAME}-postgres-${DOCKER_ENVIRONMENT}
    build:
      context: .
      dockerfile: scripts/containers/dev/database/postgres/Dockerfile
      args:
        - VERSION=${POSTGRES_VERSION:-16}
      shm_size: 512mb
    env_file:
      - scripts/containers/dev/database/postgres/.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - POSTGRES_USER=${POSTGRES_USER:-symfony}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-!ChangeMe!}
    networks:
      - back-end
    ports:
      - 127.0.0.1:${POSTGRES_LOCALHOST_PORT}:5432
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-d",
          "${POSTGRES_DB:-app}",
          "-U",
          "${POSTGRES_USER:-symfony}",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - type: volume
        source: postgres_volume
        target: /var/lib/postgresql/data
        volume:
          nocopy: true
    labels:
      com.symfony.server.service-prefix: "DATABASE"
    # Tuning lives here, not in database/postgres/etc/postgresql.conf — that file is a stock
    # reference template with a single active directive. See its header comment.
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1536MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          memory: 2048M
    restart: unless-stopped

  # >>>> Message - RabbitMQ                                                            https://hub.docker.com/_/rabbitmq
  rabbitmq:
    profiles: ["core"]
    container_name: ${DOCKER_CONTAINER_NAME}-rabbitmq-${DOCKER_ENVIRONMENT}
    build:
      context: .
      dockerfile: scripts/containers/dev/message/rabbitmq/Dockerfile
      args:
        - VERSION=${RABBITMQ_VERSION:-3.13}
    env_file:
      - scripts/containers/dev/message/rabbitmq/.env
    environment:
      - RABBITMQ_DISK_FREE_LIMIT=1GB
    networks:
      - back-end
    ports:
      - 127.0.0.1:${RABBITMQ_LOCALHOST_PORT}:5672
      - 127.0.0.1:${RABBITMQ_WEBSITE_PORT}:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      # Without this, vhosts, users and durable queues are lost on every `down`.
      - rabbitmq_volume:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 1024M
    restart: unless-stopped

  # >>>> Database - MySQL                                                                 https://hub.docker.com/_/mysql
  # Alternate to PostgreSQL — never started by the `core` profile.
  mysql:
    profiles: ["database-alt"]
    container_name: ${DOCKER_CONTAINER_NAME}-mysql-${DOCKER_ENVIRONMENT}
    build:
      context: .
      dockerfile: scripts/containers/dev/database/mysql/Dockerfile
      args:
        - VERSION=${MYSQL_VERSION:-8.4}
    env_file:
      - scripts/containers/dev/database/mysql/.env
    environment:
      - MYSQL_DATABASE=${MYSQL_DB:-app}
    networks:
      - back-end
    ports:
      - 127.0.0.1:${MYSQL_LOCALHOST_PORT:-3306}:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - mysql_volume:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 1024M
    restart: unless-stopped

  # >>>> Database - Mongo                                                                 https://hub.docker.com/_/mongo
  # Alternate to PostgreSQL — never started by the `core` profile.
  mongo:
    profiles: ["database-alt"]
    container_name: ${DOCKER_CONTAINER_NAME}-mongo-${DOCKER_ENVIRONMENT}
    build:
      context: .
      dockerfile: scripts/containers/dev/database/mongo/Dockerfile
      args:
        - VERSION=${MONGO_VERSION:-8.0}
    env_file:
      - scripts/containers/dev/database/mongo/.env
    networks:
      - back-end
    ports:
      - 127.0.0.1:${MONGO_LOCALHOST_PORT:-27017}:27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - mongo_volume:/data/db
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          memory: 1024M
    restart: unless-stopped

  # >>>> Utility - PgAdmin                                                       https://hub.docker.com/r/dpage/pgadmin4
  pgadmin:
    profiles: ["utility"]
    container_name: ${DOCKER_CONTAINER_NAME}-pgadmin-${DOCKER_ENVIRONMENT}
    image: dpage/pgadmin4:${PGADMIN_VERSION:-9.17}
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_MAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PW}
      - PGADMIN_LISTEN_ADDRESS=0.0.0.0
      - GUNICORN_THREADS=4
      - GUNICORN_WORKERS=2
      - PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION=False
      - PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED=False
      - PGADMIN_CONFIG_CONSOLE_LOG_LEVEL=30
    networks:
      - front-end
      - back-end
    ports:
      - 127.0.0.1:${PGADMIN_WEBSITE_PORT}:80
    volumes:
      - pgadmin_volume:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 512M
    restart: unless-stopped

# ----------------------------------------------------------------------------------------------------------------------
# Networks                                                     https://docs.docker.com/compose/compose-file/06-networks/
# ----------------------------------------------------------------------------------------------------------------------
networks:
  # scripts/containers/prod/deploy.sh attaches the app container to `symfony_back-end`.
  back-end:
    driver: bridge
    internal: false
    enable_ipv6: false
  # Referenced by pgadmin. Its absence made the whole compose project invalid.
  front-end:
    driver: bridge
    internal: false
    enable_ipv6: false

# ----------------------------------------------------------------------------------------------------------------------
# Volumes                                                       https://docs.docker.com/compose/compose-file/07-volumes/
# ----------------------------------------------------------------------------------------------------------------------
volumes:
  redis_volume: {}
  postgres_volume: {}
  rabbitmq_volume: {}
  mysql_volume: {}
  mongo_volume: {}
  pgadmin_volume: {}
