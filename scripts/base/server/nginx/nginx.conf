# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

# Workers must never run as root (.claude/rules/server-nginx-rule.md). www-data is the same user the
# php-fpm pool runs as, so both can read app/public and write app/var without a group grant.
user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # >>>> Compress
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_disable "msie6";
    # Already-compressed formats (png/jpeg/woff2) are deliberately absent — re-compressing them burns
    # CPU for no gain. application/x-javascript is deprecated; use application/javascript.
    gzip_types
            text/plain
            text/css
            text/xml
            application/javascript
            application/json
            application/xml
            application/rss+xml
            image/svg+xml;

    # >>>> Default Server
    server_names_hash_max_size  512;
    server_names_hash_bucket_size   128;

    # >>>> Logs
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;
}
