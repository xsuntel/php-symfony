# ----------------------------------------------------------------------------------------------------------------------
# Nginx - Virtual Host - Symfony                     https://symfony.com/doc/current/setup/web_server_configuration.html
# ----------------------------------------------------------------------------------------------------------------------
# Bare-metal / dev counterpart of scripts/containers/prod/server/nginx/etc/nginx/http.d/www.conf.
# .claude/rules/server-nginx-rule.md requires the two to implement the same routing; only three things
# may differ, and all three are marked below:
#   1. listen 80 (prod: 8080, published by the container)
#   2. fastcgi_pass over a Unix socket (prod: 127.0.0.1:9000, same-container TCP)
#   3. file-based logs (prod: /dev/stdout + /dev/stderr, for `docker logs`)

server {
    listen 80;                                                                          # <<<< differs from prod
    #listen [::]:80;

    server_name example.com api.example.com www.example.com "";
    server_tokens off;

    root /var/www/github/symfony/app/public;
    index index.php;

    # >>>> Client
    client_max_body_size 128M;
    keepalive_timeout 5;
    send_timeout 10s;

    client_header_buffer_size 8k;
    large_client_header_buffers 8 32k;

    # >>>> Security headers
    # No Content-Security-Policy here — CSP is application-specific and belongs in Symfony
    # (NelmioSecurityBundle or a controller response), per .claude/rules/server-nginx-rule.md.
    #
    # nginx REPLACES this set rather than merging it as soon as a location declares its own
    # add_header. Every location below that sets Cache-Control therefore has to repeat these three
    # lines — do not "de-duplicate" them, or that path silently loses all three headers.
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------------------------------------------------------
    # External
    # ------------------------------------------------------------------------------------------------------------------

    # >>>> Health Check
    # Short-circuited: never executes app/public/healthcheck.php, so it stays green while PHP-FPM is
    # saturated. Must precede every PHP-blocking rule.
    location = /healthcheck.php {
        allow all;
        log_not_found off;
        access_log off;
        return 200;
    }

    # >>>> Robots
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # >>>> Sitemap
    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    # ------------------------------------------------------------------------------------------------------------------
    # Project
    # ------------------------------------------------------------------------------------------------------------------

    # >>>> assets
    # AssetMapper output is content-hashed, so the filename is the cache buster — never expire it early.
    location /assets {
        allow all;
        log_not_found off;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated, not inherited — see the note on the server-level block above.
        add_header X-Frame-Options        "SAMEORIGIN"        always;
        add_header X-Content-Type-Options "nosniff"           always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # >>>> bundles
    # Not content-hashed, so a moderate TTL only.
    location /bundles {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Repeated, not inherited — see the note on the server-level block above.
        add_header X-Frame-Options        "SAMEORIGIN"        always;
        add_header X-Content-Type-Options "nosniff"           always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # >>>> index.php                                 https://symfony.com/doc/current/setup/web_server_configuration.html
    # Three-stage pattern — order matters, never reorder these blocks.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_buffering on;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;

        fastcgi_pass unix:/run/php/php8.4-fpm.sock;                                     # <<<< differs from prod
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # $realpath_root, not $document_root — avoids OPcache staleness on symlink-switch deploys.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_intercept_errors    off;
        fastcgi_hide_header         X-Powered-By;

        # A long connect timeout only masks a saturated FPM pool — fail fast instead.
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 180s;
        # Must stay below php-fpm's request_terminate_timeout, so FPM kills the request first and
        # logs a backtrace instead of nginx returning a bare 504.
        fastcgi_read_timeout 180s;

        # Prevents a browser requesting /index.php directly.
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Must stay AFTER `location ~ \.php$`.
    location ~ (\.jsp$|\.asp$|\.aspx$|\.perl$|\.py$|\.env$|\.tar$|\.sh$|\.ini$|\.local$|\.pwd$|\.yml$|\.cgi$) {
        deny all;
        log_not_found off;
        access_log off;
    }

    # >>>> log files                                                                    # <<<< differs from prod
    # Files, not /dev/stdout: this host runs nginx under systemd, so logrotate owns these.
    access_log  /var/log/nginx/www_access.log main;
    error_log   /var/log/nginx/www_error.log warn;
}
